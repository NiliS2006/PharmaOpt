services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: pharma, POSTGRES_PASSWORD: pharma, POSTGRES_DB: pharmaopt }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pharma"], interval: 3s, retries: 15 }
  backend:
    build: ./backend
    environment: { DATABASE_URL: "postgresql://pharma:pharma@db:5432/pharmaopt", OLLAMA_URL: "${OLLAMA_URL:-}" }
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes: { pgdata: {} }
